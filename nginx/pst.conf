# =============================================================================
#  PST Portal — virtual host (template; ${…} are filled by the nginx entrypoint
#  from DOMAIN, NGINX_SERVER_NAMES and NGINX_UPSTREAM).
# =============================================================================

upstream pst_app {
    server ${NGINX_UPSTREAM} max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ${NGINX_SERVER_NAMES};

    # Let's Encrypt HTTP-01 challenges (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://${DOMAIN}$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS (HTTP/2 + HTTP/3)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport default_server;
    listen [::]:443 quic reuseport default_server;
    http2 on;
    http3 on;
    quic_retry on;
    quic_gso on;

    server_name ${NGINX_SERVER_NAMES};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # Aliases (e.g. www) → canonical host.
    if ($host != "${DOMAIN}") {
        return 301 https://${DOMAIN}$request_uri;
    }

    limit_conn pst_conn 60;

    # Hidden files (.git, .env …) are never served.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ---- public uploads, straight from the storage volume ----------------
    # Only <storage>/public is exposed; private files go through /api/files
    # with a signed, expiring URL.
    location /media/ {
        alias /srv/storage/public/;
        limit_except GET HEAD { deny all; }
        disable_symlinks on;
        autoindex off;
        try_files $uri =404;
        # Base headers only: the media-specific CSP below replaces the site CSP.
        include /etc/nginx/snippets/security-headers-base.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # Uploaded files can never run script, even if mis-typed.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        access_log off;
    }

    # ---- Next.js build assets: immutable, cached at the edge -------------
    location /_next/static/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_cache pst_static;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    location /brand/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_cache pst_static;
        proxy_cache_valid 200 7d;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ---- authentication: strict rate limit ---------------------------------
    location ~ ^/api/auth/(login|2fa/verify|password/forgot|password/reset)$ {
        limit_req zone=pst_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- public forms (with uploads) ---------------------------------------
    location = /api/register {
        limit_req zone=pst_forms burst=3 nodelay;
        client_max_body_size 20m;   # photo (5 MB) + ID scan (8 MB) + fields
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~ ^/api/(aspirations|contact|membership/status|aspirations/track)$ {
        limit_req zone=pst_forms burst=5 nodelay;
        client_max_body_size 30m;   # up to 3 attachments × 8 MB
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- Telegram webhook: only Telegram's published networks --------------
    location = /api/telegram/webhook {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;
        client_max_body_size 1m;
        include /etc/nginx/snippets/proxy.conf;
    }

    # ---- backoffice API (media uploads up to 25 MB, member import) ---------
    location /api/admin/ {
        limit_req zone=pst_api burst=60 nodelay;
        client_max_body_size 30m;
        proxy_request_buffering off;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        limit_req zone=pst_api burst=40 nodelay;
        client_max_body_size 1m;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- pages --------------------------------------------------------------
    location / {
        limit_req zone=pst_pages burst=80 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
