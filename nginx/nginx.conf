load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid        /run/nginx.pid;
error_log  /var/log/nginx/pst/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    charset utf-8;

    # Access log in a file (not stdout) so Fail2Ban on the host can read it.
    log_format pst '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" rt=$request_time '
                   'urt=$upstream_response_time proto=$server_protocol rid=$request_id';
    access_log /var/log/nginx/pst/access.log pst buffer=32k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout   60s;   # slow mobile uploads (photos, ID scans)
    send_timeout          60s;
    reset_timedout_connection on;
    client_max_body_size  2m;    # raised per location for upload endpoints
    client_body_buffer_size 256k;
    large_client_header_buffers 4 16k;

    # ---- compression (Brotli for modern browsers, gzip fallback) ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/manifest+json application/rss+xml
               image/svg+xml font/ttf font/otf;
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 512;
    brotli_types text/plain text/css text/xml application/xml application/javascript
                 application/json application/manifest+json application/rss+xml
                 image/svg+xml font/ttf font/otf;

    # ---- rate limiting (per client IP) -------------------------------------
    # Credentials / OTP / password reset: 10 per minute.
    limit_req_zone $binary_remote_addr zone=pst_auth:10m   rate=10r/m;
    # Public forms with uploads (registration, aspirations, contact): 6 per minute.
    limit_req_zone $binary_remote_addr zone=pst_forms:10m  rate=6r/m;
    # Other API calls.
    limit_req_zone $binary_remote_addr zone=pst_api:20m    rate=20r/s;
    # Pages and assets.
    limit_req_zone $binary_remote_addr zone=pst_pages:20m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=pst_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # ---- caches -------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/pst levels=1:2 keys_zone=pst_static:20m
                     max_size=1g inactive=30d use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- TLS session cache shared by all vhosts ----------------------------
    ssl_session_cache   shared:PST_SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
