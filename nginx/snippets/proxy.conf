proxy_pass http://pst_app;
proxy_http_version 1.1;
proxy_set_header Host              $host;
# The app trusts X-Real-IP (TRUST_PROXY=true). Both headers are overwritten
# here so a client can never inject a spoofed address.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffers 16 32k;
proxy_buffer_size 32k;
# Headers set authoritatively by nginx (avoid duplicates from Next.js).
proxy_hide_header X-Powered-By;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
