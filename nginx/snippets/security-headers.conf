# Included in every location that sets its own add_header (nginx does not
# inherit add_header from the server block once a location defines one).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# camera: KTA QR check-in scanner in the backoffice.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# Alt-Svc advertises HTTP/3 (QUIC on UDP 443).
add_header Alt-Svc 'h3=":443"; ma=86400' always;
# CSP notes:
#  - 'unsafe-inline' for scripts: Next.js App Router injects inline bootstrap
#    scripts; switch to nonces if you enable per-request CSP in the app.
#  - tile.openstreetmap.org: municipality map tiles (NEXT_PUBLIC_MAP_TILE_URL) — update if you change tile provider.
#  - challenges.cloudflare.com: optional Turnstile widget.
#  - youtube-nocookie / vimeo / facebook: click-to-play video embeds.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://www.facebook.com https://challenges.cloudflare.com; media-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
