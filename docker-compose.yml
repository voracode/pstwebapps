# =============================================================================
#  PST Portal — production stack (Ubuntu 26.04 LTS VPS)
#
#    docker compose --env-file .env.production up -d
#
#  Network layout
#    nginx     host network: real client IPs (IPv4/IPv6) for logs, rate limits
#              and Fail2Ban; serves :80, :443/tcp (HTTP/1.1, HTTP/2) and
#              :443/udp (HTTP/3). Proxies to the app on 127.0.0.1:3000.
#    app       published on 127.0.0.1:3000 only — never reachable from outside.
#    postgres, redis, worker, backup: internal network only, no published ports.
# =============================================================================

name: pst

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-env: &env
  env_file: .env.production

services:
  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pst}
      POSTGRES_USER: ${POSTGRES_USER:-pst_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-pst_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      TZ: Asia/Dili
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=1000
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction: the notification queue and rate-limit counters must never be dropped silently.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --protected-mode yes
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { memory: 320m }
    logging: *logging

  # ------------------------------------------------------------------ one-shot jobs
  migrate:
    build: { context: ., target: tools }
    image: pst-tools:latest
    <<: *env
    # Migrations run as the schema owner; the app itself uses the restricted role.
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:?set MIGRATE_DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    # Storage is mounted so maintenance scripts run through this service
    # (legacy import, key rotation) can write uploads.
    volumes:
      - storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    restart: "no"
    logging: *logging

  # ------------------------------------------------------------------ application
  app:
    build: { context: ., target: app }
    image: pst-app:latest
    restart: unless-stopped
    <<: *env
    # The app never gets the schema-owner credentials, only the restricted role.
    environment: &no-owner-creds
      MIGRATE_DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    # Not read_only: Next.js writes its ISR/page cache under .next at runtime.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1g }
    logging: *logging

  worker:
    image: pst-tools:latest
    restart: unless-stopped
    <<: *env
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    environment: *no-owner-creds
    depends_on:
      app: { condition: service_healthy }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512m }
    logging: *logging

  # ------------------------------------------------------------------ edge
  nginx:
    build: { context: ./nginx }
    image: pst-nginx:latest
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-${DOMAIN}}
      NGINX_UPSTREAM: ${NGINX_UPSTREAM:-127.0.0.1:3000}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|NGINX_SERVER_NAMES|NGINX_UPSTREAM)$"
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt:ro
      - ./data/certbot-www:/var/www/certbot:ro
      - ./data/nginx-logs:/var/log/nginx/pst
      - storage:/srv/storage:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      app: { condition: service_healthy }
    logging: *logging

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot
    # Renewal loop; Nginx reloads itself every 6 h to pick up new certificates.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging

  backup:
    build: { context: ., dockerfile: docker/backup/Dockerfile }
    image: pst-backup:latest
    restart: unless-stopped
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pst}
      POSTGRES_USER: ${POSTGRES_USER:-pst_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      BACKUP_ENCRYPTION_PUBLIC_KEY: ${BACKUP_ENCRYPTION_PUBLIC_KEY:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_CHAT_ID_SYSTEM: ${TELEGRAM_CHAT_ID_SYSTEM:-}
      TZ: Asia/Dili
    volumes:
      - ./data/backups:/backups
      - storage:/storage:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    logging: *logging

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  storage:
  nginx-cache:
